# --- PORT pour Railway / Render ---
server.port=${PORT:8080}

# --- URL PostgreSQL - utilise les variables Railway, sinon localhost ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/services_informatique}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aline1122@}

# --- Driver PostgreSQL ---
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate pour PostgreSQL ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Pool ---
spring.datasource.hikari.maximum-pool-size=5