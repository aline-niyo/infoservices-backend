# URL de connexion avec le nom exact de votre base de données
spring.datasource.url=jdbc:mysql://localhost:3306/service_informatique?useSSL=false&allowPublicKeyRetrieval=true

# Identifiants XAMPP par défaut
spring.datasource.username=root
spring.datasource.password=

# Driver JDBC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialect Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Utiliser 'update' ou 'none' pour lire vos données existantes sans recréer les tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true